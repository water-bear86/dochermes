<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocHermes Context</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 12px;
        width: 320px;
        background: #f8fafc;
        color: #0f172a;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
      }

      p {
        margin: 0;
        font-size: 12px;
        color: #475569;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      button.primary {
        background: #0f172a;
        color: #f8fafc;
      }

      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }

      textarea {
        width: 100%;
        height: 140px;
        resize: vertical;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px;
        font-size: 11px;
        line-height: 1.35;
        background: #ffffff;
        color: #0f172a;
      }

      .status {
        min-height: 16px;
        font-size: 11px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <h1>DocHermes Context</h1>
      <p>Extract browser DOM context and copy it for DocHermes clipboard monitoring.</p>
      <button id="extract" class="primary" type="button">Extract Context</button>
      <button id="copy" class="secondary" type="button" disabled>Copy For DocHermes</button>
      <div id="status" class="status"></div>
      <textarea id="payload" readonly placeholder="Extracted context will appear here."></textarea>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
